[project]
name = "planet-health-backend"
version = "0.1.0"
description = "FastAPI backend for the Planet Health plant analysis platform."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
# `alembic/versions` contains generated migrations.
# `inference.py` is transferred research code and must stay byte-for-byte
# unmodified, so it is not linted or reformatted.
extend-exclude = ["alembic/versions", "inference.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: `class ModelStatus(str, Enum)` is kept deliberately — the code always
# reads the explicit `.value`, and the mixin keeps the enum JSON friendly
# without depending on Python 3.11's `StrEnum`.
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
# Pin the first-party packages so the import order is identical whether Ruff
# is run from `backend/` or from the repository root.
known-first-party = ["api", "core", "db", "schemas", "services", "tests"]

[tool.ruff.lint.per-file-ignores]
# `alembic/env.py` lives in a directory that shares its name with the
# third-party Alembic package, so the import grouping cannot be resolved
# automatically. The module also needs imports after a path manipulation.
"**/alembic/env.py" = ["E402", "I001"]
